name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Tvinder Online Test APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: |
          chmod +x tool/build_apk.sh
          ./tool/build_apk.sh

      - name: Verify APK exists
        run: |
          test -f tvinder-online-test.apk
          ls -lh tvinder-online-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvinder-online-test-apk
          path: tvinder-online-test.apk
          if-no-files-found: error
          retention-days: 7
